[package]
name = "raffine"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bumpalo = { version = "3.20.3", features = ["boxed", "collections"] }
cxx = { version = "1.0.202", features = ["c++20"] }
melior.workspace = true
mlir-sys = "210.0.4"
rustc-hash = { version = "2.1.3", features = ["rand"] }
thiserror = "2.0.20"
tracing.workspace = true
ustr = "1.1.0"

[dev-dependencies]
tracing-subscriber.workspace = true

[build-dependencies]
cxx-build = { version = "1.0.202", features = ["parallel"] }
