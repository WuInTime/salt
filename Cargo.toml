[workspace]
resolver = "3"
members = ["analyzer", "cachegrind-runner", "denning", "raffine"]

[workspace.dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.7", default-features = false, features = [
    "derive",
    "std",
    "help",
    "usage",
    "error-context",
] }
indicatif = { version = "0.18.6", features = ["rayon"] }
melior = "0.26.9"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = [
    "std",
    "log",
] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
#lto = "thin"
debug = false
opt-level = 3

[profile.wasm-release]
inherits = "release" # Start with release settings
opt-level = 's'      # Optimize for size
lto = true           # More aggressive LTO
codegen-units = 1    # Better optimizations
panic = 'abort'      # Smaller code size
strip = true         # Remove symbols
